name: Build Web Mobile (Cocos Creator 2.4.15)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Cocos Creator 2.4.15
        shell: pwsh
        run: |
          Write-Host "Downloading Cocos Creator 2.4.15..."
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri "https://download.cocos.com/CocosCreator/v2.4.15/CocosCreator_v2.4.15_20250328_win.zip" -OutFile "$env:RUNNER_TEMP\cocos.zip" -UseBasicParsing
          Write-Host "Downloaded. Extracting..."
          Expand-Archive "$env:RUNNER_TEMP\cocos.zip" -DestinationPath "$env:RUNNER_TEMP\cocos" -Force
          Get-ChildItem "$env:RUNNER_TEMP\cocos" -Recurse -Filter "*.exe" | Select-Object FullName, Length

      - name: Build web-mobile
        shell: pwsh
        run: |
          $creator = Get-ChildItem "$env:RUNNER_TEMP\cocos" -Recurse -Filter "CocosCreator.exe" | Select-Object -First 1
          if (-not $creator) {
            $creator = Get-ChildItem "$env:RUNNER_TEMP\cocos" -Recurse -Filter "*.exe" | Select-Object -First 1
          }
          Write-Host "Creator path: $($creator.FullName)"
          Write-Host "Project path: $env:GITHUB_WORKSPACE"

          # 预创建配置目录
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.CocosCreator" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\AppData\Roaming\CocosCreator" | Out-Null

          # 后台启动 Creator(带 --nologin 跳过登录)
          $logFile = "$env:RUNNER_TEMP\creator-build.log"
          $p = Start-Process -FilePath $creator.FullName `
            -ArgumentList "--nologin","--project","`"$env:GITHUB_WORKSPACE`"","--build","`"platform=web-mobile`"" `
            -RedirectStandardOutput $logFile -RedirectStandardError "$env:RUNNER_TEMP\creator-build-err.log" `
            -PassThru

          # 轮询等待构建产物出现(最多60分钟)
          $deadline = (Get-Date).AddMinutes(60)
          $buildDir = "$env:GITHUB_WORKSPACE\build\web-mobile"
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 20
            # 检查产物
            if (Test-Path "$buildDir\index.html") {
              Write-Host "BUILD COMPLETE - index.html found"
              break
            }
            # 检查进程是否退出
            if ($p.HasExited) {
              Write-Host "Creator process exited with code $($p.ExitCode)"
              # 检查是否产物已生成(可能是正常退出)
              if (Test-Path "$buildDir\index.html") {
                Write-Host "BUILD COMPLETE after exit"
                break
              }
              # 日志尾部
              if (Test-Path $logFile) {
                Get-Content $logFile -Tail 30
              }
              Write-Host "PROCESS EXITED WITHOUT OUTPUT"
              exit 1
            }
          }

          # 最终检查
          if (Test-Path "$buildDir\index.html") {
            Write-Host "SUCCESS: build/web-mobile exists"
            # 停止Creator
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            exit 0
          } else {
            Write-Host "FAILED: no build output after timeout"
            if (Test-Path $logFile) { Get-Content $logFile -Tail 50 }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            exit 1
          }

      - name: List build output
        shell: pwsh
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE\build\web-mobile") {
            Get-ChildItem "$env:GITHUB_WORKSPACE\build\web-mobile" -Recurse -File | Measure-Object | Select-Object Count
            Get-ChildItem "$env:GITHUB_WORKSPACE\build\web-mobile" | Select-Object Name, Length | Format-Table -AutoSize
          } else {
            Write-Host "NO BUILD DIRECTORY"
            Get-ChildItem "$env:GITHUB_WORKSPACE" -Directory | Select-Object Name
          }

      - name: Upload web-mobile artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-mobile
          path: ${{ github.workspace }}/build/web-mobile/**
          if-no-files-found: warn
