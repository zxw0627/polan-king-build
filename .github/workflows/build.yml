name: Build Web Mobile (Cocos Creator 2.4.10)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Cocos Creator 2.4.10 (643MB)
        shell: pwsh
        run: |
          Write-Host "Downloading Cocos Creator 2.4.10..."
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri "https://download.cocos.com/CocosCreator/v2.4.10/CocosCreator-v2.4.10-20220816-win.zip" -OutFile "$env:RUNNER_TEMP\cocos.zip" -UseBasicParsing
          Write-Host "Downloaded. Extracting..."
          Expand-Archive "$env:RUNNER_TEMP\cocos.zip" -DestinationPath "$env:RUNNER_TEMP\cocos" -Force
          Get-ChildItem "$env:RUNNER_TEMP\cocos" -Recurse -Filter "*.exe" | Select-Object FullName, Length

      - name: Build web-mobile
        shell: pwsh
        run: |
          $creator = Get-ChildItem "$env:RUNNER_TEMP\cocos" -Recurse -Filter "CocosCreator.exe" | Select-Object -First 1
          if (-not $creator) {
            $creator = Get-ChildItem "$env:RUNNER_TEMP\cocos" -Recurse -Filter "*.exe" | Select-Object -First 1
          }
          Write-Host "Creator path: $($creator.FullName)"
          Write-Host "Project path: $env:GITHUB_WORKSPACE"
          # Creator 2.x 命令行构建
          & $creator.FullName --project $env:GITHUB_WORKSPACE --build "platform=web-mobile" 2>&1 | Out-Host
          $exitCode = $LASTEXITCODE
          Write-Host "Creator exit code: $exitCode"
          # 以产物存在与否判断成功
          if (Test-Path "$env:GITHUB_WORKSPACE\build\web-mobile") {
            Write-Host "BUILD OUTPUT EXISTS - success"
            exit 0
          } else {
            Write-Host "NO BUILD OUTPUT - failure"
            exit 1
          }

      - name: List build output
        shell: pwsh
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE\build") {
            Get-ChildItem "$env:GITHUB_WORKSPACE\build" -Recurse -File | Measure-Object | Select-Object Count
            Get-ChildItem "$env:GITHUB_WORKSPACE\build\web-mobile" | Select-Object Name, Length | Format-Table -AutoSize
          } else {
            Write-Host "NO BUILD DIRECTORY"
            Get-ChildItem "$env:GITHUB_WORKSPACE" -Directory | Select-Object Name
          }

      - name: Upload web-mobile artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-mobile
          path: ${{ github.workspace }}/build/web-mobile/**
          if-no-files-found: warn
